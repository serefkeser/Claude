name: Fix Cumhuriyet OCR 3.14.36

on:
  push:
    branches: [main]
    paths:
      - scripts/fix-cumhuriyet-ocr-31436.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply OCR fix
        run: node scripts/fix-cumhuriyet-ocr-31436.mjs
      - name: Verify version
        run: node scripts/check-version-consistency.mjs
      - name: Run focused OCR tests
        run: npx vitest run apps/web/src/lib/newspaperVerification.test.ts
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/lib/newspaperVerification.ts apps/web/src/lib/newspaperVerification.test.ts package.json package-lock.json apps/web/package.json apps/web/src/version.ts packages/shared-config/package.json packages/shared-types/package.json packages/shared-utils/package.json services/api-gateway/package.json services/api-gateway/src/index.ts services/api-gateway/src/routes/health.ts services/media-storage/package.json services/video-renderer/package.json services/video-renderer/src/index.ts
          git commit -m "fix: recover dense Cumhuriyet OCR headlines"
          git push

name: Prepare OTONOM 3.14.42

on:
  push:
    branches: [main]
    paths:
      - '.github/release-trigger-3.14.42'

permissions:
  contents: write

jobs:
  bump-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Bump patch version
        run: npm run version:bump

      - name: Check version consistency
        run: npm run version:check

      - name: Run full Vitest suite
        run: npm test

      - name: Typecheck web app
        run: npm run typecheck --workspace=apps/web

      - name: Build web app
        run: npm run build:web
        env:
          VITE_API_URL: https://api.seref-keser.workers.dev

      - name: Typecheck AI gateway
        run: npm run typecheck --workspace=services/api-gateway

      - name: Test AI gateway
        run: npm run test --workspace=services/api-gateway

      - name: Commit generated 3.14.42 version files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: bump OTONOM to 3.14.42'
          git push origin HEAD:main

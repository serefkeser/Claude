name: Apply headline box patch

on:
  push:
    branches: [main]
    paths:
      - scripts/patch-headline-box.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply renderer patch
        run: node scripts/patch-headline-box.mjs

      - name: Commit renderer change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/lib/localRenderer.ts
          if git diff --cached --quiet; then
            echo "No renderer change required"
            exit 0
          fi
          git commit -m "feat: box newspaper content headlines"
          git push

name: Fix Cumhuriyet Newspaper Regression 3.14.39

on:
  push:
    branches: [main]
    paths:
      - scripts/fix-newspaper-regression-31439.mjs
      - .github/workflows/fix-newspaper-regression-31439.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Apply regression fix
        run: node scripts/fix-newspaper-regression-31439.mjs
      - name: Bump OTONOM patch version
        run: node scripts/bump-patch-version.mjs
      - name: Check version consistency
        run: node scripts/check-version-consistency.mjs
      - name: Run focused newspaper tests
        run: npm exec vitest -- run apps/web/src/lib/newspaperVisionRecovery.test.ts apps/web/src/lib/newspaperPipeline.test.ts apps/web/src/lib/storyboard.test.ts apps/web/src/lib/newspaperCopy.test.ts
      - name: Run full Vitest suite
        run: npm test
      - name: Typecheck and build web
        run: |
          npm run typecheck:web
          npm run build:web
      - name: Commit tested fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/lib/newspaperVisionRecovery.ts apps/web/src/lib/newspaperVisionRecovery.test.ts apps/web/src/lib/newspaperPipeline.ts apps/web/src/lib/newspaperPipeline.test.ts apps/web/src/lib/storyboard.ts apps/web/src/lib/storyboard.test.ts package.json package-lock.json apps/web/package.json apps/web/src/version.ts packages/shared-config/package.json packages/shared-types/package.json packages/shared-utils/package.json services/api-gateway/package.json services/api-gateway/src/index.ts services/api-gateway/src/routes/health.ts services/media-storage/package.json services/video-renderer/package.json services/video-renderer/src/index.ts
          git commit -m "fix: fail closed on newspaper OCR disagreement"
          git push


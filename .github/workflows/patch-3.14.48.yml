name: Patch and Verify OTONOM 3.14.48

on:
  push:
    branches: ['fix/newspaper-single-image-3.14.48']
    paths:
      - '.github/release-trigger-3.14.48'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply deterministic 3.14.48 patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              actual = text.count(old)
              expected = 1 if count is None else count
              if actual != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {actual}: {old[:100]!r}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          replace(
              'services/api-gateway/src/ai/providerRouter.ts',
              "const DEFAULT_VISION_ORDER: AiProviderName[] = ['gemini', 'openrouter'];",
              "const DEFAULT_VISION_ORDER: AiProviderName[] = ['gemini', 'nvidia', 'openrouter'];",
          )
          replace(
              'services/api-gateway/src/ai/providerRouter.ts',
              "const OPENROUTER_VISION_TIMEOUT_MS = 55_000;\nconst TTS_TIMEOUT_MS = 60_000;",
              "const OPENROUTER_VISION_TIMEOUT_MS = 55_000;\nconst NVIDIA_VISION_TIMEOUT_MS = 55_000;\nconst TTS_TIMEOUT_MS = 60_000;",
          )
          replace(
              'services/api-gateway/src/ai/providerRouter.ts',
              "      supportsVision: true,\n      jsonMode: false,\n    } : undefined,\n    opencode:",
              "      supportsVision: true,\n      jsonMode: false,\n      extraHeaders: { Accept: 'application/json' },\n    } : undefined,\n    opencode:",
          )
          replace(
              'services/api-gateway/src/ai/providerRouter.ts',
              "function providerTimeoutMs(provider: ProviderDefinition, request: AiGenerationRequest) {\n  if (request.task === 'vision' && provider.name === 'openrouter') return OPENROUTER_VISION_TIMEOUT_MS;\n  return PROVIDER_TIMEOUT_MS;\n}",
              "function providerTimeoutMs(provider: ProviderDefinition, request: AiGenerationRequest) {\n  if (request.task === 'vision' && provider.name === 'nvidia') return NVIDIA_VISION_TIMEOUT_MS;\n  if (request.task === 'vision' && provider.name === 'openrouter') return OPENROUTER_VISION_TIMEOUT_MS;\n  return PROVIDER_TIMEOUT_MS;\n}",
          )
          replace(
              'services/api-gateway/src/ai/providerRouter.ts',
              "        body.provider = { require_parameters: true };",
              "        body.provider = { require_parameters: true, allow_fallbacks: true };",
          )
          replace(
              'services/api-gateway/src/ai/providerRouter.ts',
              "async function callGemini(\n  provider: ProviderDefinition,\n  request: AiGenerationRequest,\n): Promise<string> {",
              "async function callGemini(\n  provider: ProviderDefinition,\n  request: AiGenerationRequest,\n  retryHint = false,\n): Promise<string> {",
          )
          replace(
              'services/api-gateway/src/ai/providerRouter.ts',
              "  const contents = request.messages\n    .filter(message => message.role !== 'system')\n    .map(message => ({\n      role: message.role === 'assistant' ? 'model' : 'user',\n      parts: toGeminiParts(message.content),\n    }));\n  const schema = selectedResponseSchema(request);",
              "  const contents = request.messages\n    .filter(message => message.role !== 'system')\n    .map(message => ({\n      role: message.role === 'assistant' ? 'model' : 'user',\n      parts: toGeminiParts(message.content),\n    }));\n  if (retryHint && request.responseSchema === 'newspaper') {\n    contents.push({\n      role: 'user',\n      parts: [{\n        text: 'Önceki gazete yanıtı doğrulamayı geçmedi. Aynı TEK birleşik görseli yeniden incele. Soldaki tam sayfayı ana geometri kabul et; sağ üst ve sağ alt paneller yalnız aynı sayfanın yakın planıdır. Yalnız gerçekten okuyabildiğin başlık+açıklamaları JSON şemasında döndür; sayı tamamlamak için tahmin etme.',\n      }],\n    });\n  }\n  const schema = selectedResponseSchema(request);",
          )
          replace(
              'services/api-gateway/src/ai/providerRouter.ts',
              "          ? await callGemini(provider, request)",
              "          ? await callGemini(provider, request, callIndex === 1)",
          )

          replace(
              'services/api-gateway/src/ai/providerRouter.test.ts',
              "    expect(body.provider).toEqual({ require_parameters: true });",
              "    expect(body.provider).toEqual({ require_parameters: true, allow_fallbacks: true });",
          )

          replace(
              'services/api-gateway/src/ai/promptBuilder.ts',
              "1. Gönderilen görseller AYNI gazete sayfasının tam görünümü ve örtüşen yakın planları olabilir. Bunları tek sayfa olarak birlikte değerlendir. Yakın planda tekrar görülen aynı haberi yalnız bir kez say.",
              "1. Gönderilen TEK görsel bir gazete kanıt kolajıdır: solda tam sayfa, sağ üstte üst yakın plan, sağ altta alt yakın plan vardır. Üç panel AYNI gazete sayfasına aittir; sağ paneller yalnız okuma desteğidir, ayrı sayfa değildir. Tekrar görülen aynı haberi yalnız bir kez say.",
          )
          replace(
              'services/api-gateway/src/ai/promptBuilder.ts',
              "9. Koordinatlar tam sayfa için sol üst 0,0; sağ alt 100,100 olacak şekilde yüzde cinsinden yaklaşık x/y/w/h değerleridir. Yakın plan kullanarak okusan bile koordinatı tam sayfaya göre yaklaşıkla.",
              "9. Koordinatlar YALNIZ soldaki tam sayfa paneli için sol üst 0,0; sağ alt 100,100 olacak şekilde yüzde cinsinden yaklaşık x/y/w/h değerleridir. Sağdaki yakın planı kullanarak okusan bile koordinatı soldaki tam sayfaya göre yaklaşıkla.",
          )
          replace(
              'services/api-gateway/src/ai/promptBuilder.ts',
              "Aynı gazete sayfasının görünümlerini birlikte incele, tekrarları birleştir ve yalnız isContentUnreadable + gazeteBasliklari JSON yapısını döndür.",
              "Tek birleşik görselde soldaki tam sayfayı ve sağdaki iki yakın planı birlikte incele, tekrarları birleştir ve yalnız isContentUnreadable + gazeteBasliklari JSON yapısını döndür.",
          )

          replace(
              'apps/web/src/lib/aiClient.ts',
              "writeSystemLog('Gazete Vision hazırlığı: tam sayfa + üst yakın plan + alt yakın plan olmak üzere 3 görünüm hazırlandı.');",
              "writeSystemLog('Gazete Vision hazırlığı: tam sayfa + üst/alt yakın plan tek birleşik JPEG içinde hazırlandı; sağlayıcıya yalnız 1 image gönderilecek.');",
          )
          replace(
              'apps/web/src/lib/aiClient.ts',
              "writeSystemLog('Hermes 10 gazete okuma modu: aynı sayfanın tam görünümü ve örtüşen yakın planları Vision modele gönderiliyor.');",
              "writeSystemLog('Hermes 10 gazete okuma modu: aynı sayfanın tam görünümü ve iki yakın planı TEK Vision görseli olarak gönderiliyor.');",
          )
          replace(
              'apps/web/src/lib/aiClient.ts',
              "GAZETE OKUMA: Gönderilen görseller aynı gazete sayfasının tam görünümü ve yakın planlarıdır. Tek bir sayfa gibi birlikte değerlendir; tekrar eden haberi bir kez say. Görseldeki gerçek haber başlıklarını ve onlara fiziksel olarak bağlı açıklamaları doğrudan görselden oku. Okuyamadığın kelimeyi uydurma.",
              "GAZETE OKUMA: Gönderilen TEK görsel bir kanıt kolajıdır. Soldaki panel tam gazete sayfasıdır; sağ üst ve sağ alt paneller aynı sayfanın yakın planlarıdır. Sağ panellerden okuduğun metni soldaki tam sayfadaki habere bağla; aynı haberi yalnız bir kez say. Koordinatları yalnız soldaki tam sayfaya göre 0-100 ver. Görseldeki gerçek haber başlıklarını ve onlara fiziksel olarak bağlı açıklamaları doğrudan görselden oku. Okuyamadığın kelimeyi uydurma.",
          )

          replace(
              'services/api-gateway/src/routes/ai.ts',
              "visionOrder: c.env.AI_VISION_PROVIDER_ORDER || 'gemini,openrouter',",
              "visionOrder: c.env.AI_VISION_PROVIDER_ORDER || 'gemini,nvidia,openrouter',",
          )

          wrangler = Path('services/api-gateway/wrangler.toml')
          text = wrangler.read_text(encoding='utf-8')
          old_order = 'AI_VISION_PROVIDER_ORDER = "gemini,openrouter"'
          if text.count(old_order) != 3:
              raise SystemExit(f'wrangler.toml: expected 3 Vision order entries, found {text.count(old_order)}')
          text = text.replace(old_order, 'AI_VISION_PROVIDER_ORDER = "gemini,nvidia,openrouter"')
          text = text.replace(
              '# OTONOM 3.14.47 production deploy · newspaper JSON provider recovery · release',
              '# OTONOM 3.14.48 production deploy · single-image newspaper Vision · release',
          )
          wrangler.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Set OTONOM 3.14.48 version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$CURRENT" = "3.14.47" ]; then
            npm run version:bump
          elif [ "$CURRENT" != "3.14.48" ]; then
            echo "Unexpected version: $CURRENT"
            exit 1
          fi

      - name: Check version consistency
        run: npm run version:check

      - name: Run full Vitest suite
        run: npm test

      - name: Typecheck web app
        run: npm run typecheck --workspace=apps/web

      - name: Build web app
        run: npm run build:web
        env:
          VITE_API_URL: https://api.seref-keser.workers.dev

      - name: Typecheck AI gateway
        run: npm run typecheck --workspace=services/api-gateway

      - name: Test AI gateway
        run: npm run test --workspace=services/api-gateway

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright browser e2e
        run: npm run test:e2e
        env:
          VITE_API_URL: https://api.seref-keser.workers.dev

      - name: Commit verified patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make newspaper Vision provider-compatible'
          git push origin HEAD:fix/newspaper-single-image-3.14.48

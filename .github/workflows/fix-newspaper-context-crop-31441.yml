name: Fix Newspaper Context Crop 3.14.41

on:
  push:
    branches: [main]
    paths:
      - scripts/fix-newspaper-context-crop-31441.mjs
      - .github/workflows/fix-newspaper-context-crop-31441.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Apply newspaper context crop fix
        run: node scripts/fix-newspaper-context-crop-31441.mjs
      - name: Bump OTONOM patch version
        run: node scripts/bump-patch-version.mjs
      - name: Check version consistency
        run: node scripts/check-version-consistency.mjs
      - name: Run crop and newspaper regression tests
        run: npm exec vitest -- run apps/web/src/lib/aiClient.crop.test.ts apps/web/src/lib/aiClient.guard.test.ts apps/web/src/lib/newspaperVisionRecovery.test.ts apps/web/src/lib/newspaperPipeline.test.ts
      - name: Run full Vitest suite
        run: npm test
      - name: Typecheck web app
        run: npm run typecheck --workspace=apps/web
      - name: Build web app
        run: npm run build:web
        env:
          VITE_API_URL: https://api.seref-keser.workers.dev
      - name: Commit tested fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/lib/aiClient.ts apps/web/src/lib/aiClient.crop.test.ts package.json package-lock.json apps/web/package.json apps/web/src/version.ts packages/shared-config/package.json packages/shared-types/package.json packages/shared-utils/package.json services/api-gateway/package.json services/api-gateway/src/index.ts services/api-gateway/src/routes/health.ts services/media-storage/package.json services/video-renderer/package.json services/video-renderer/src/index.ts
          git commit -m "fix: include newspaper detail in crop evidence"
          git push

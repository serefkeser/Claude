name: Patch and Verify OTONOM 3.14.49

on:
  push:
    branches: [main]
    paths:
      - '.github/release-trigger-3.14.49'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply current Vision provider patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count}, found {actual}: {old[:120]!r}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          def replace_in_test(path, anchor, pairs):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              start = text.find(anchor)
              if start < 0:
                  raise SystemExit(f'{path}: test anchor not found: {anchor}')
              end = text.find("\n  it('", start + len(anchor))
              if end < 0:
                  end = len(text)
              segment = text[start:end]
              for old, new, expected in pairs:
                  actual = segment.count(old)
                  if actual != expected:
                      raise SystemExit(f'{path}: test replacement expected {expected}, found {actual}: {old[:100]!r}')
                  segment = segment.replace(old, new)
              file.write_text(text[:start] + segment + text[end:], encoding='utf-8')

          replace('services/api-gateway/src/ai/providerRouter.ts', "const DEFAULT_VISION_ORDER: AiProviderName[] = ['gemini', 'nvidia', 'openrouter'];", "const DEFAULT_VISION_ORDER: AiProviderName[] = ['groq', 'nvidia', 'gemini', 'openrouter'];")
          replace('services/api-gateway/src/ai/providerRouter.ts', "const OPENROUTER_VISION_TIMEOUT_MS = 55_000;\nconst NVIDIA_VISION_TIMEOUT_MS = 55_000;", "const OPENROUTER_VISION_TIMEOUT_MS = 55_000;\nconst GROQ_VISION_TIMEOUT_MS = 55_000;\nconst NVIDIA_VISION_TIMEOUT_MS = 55_000;")
          replace('services/api-gateway/src/ai/providerRouter.ts', "  if (request.task === 'vision' && provider.name === 'nvidia') return NVIDIA_VISION_TIMEOUT_MS;\n  if (request.task === 'vision' && provider.name === 'openrouter') return OPENROUTER_VISION_TIMEOUT_MS;", "  if (request.task === 'vision' && provider.name === 'groq') return GROQ_VISION_TIMEOUT_MS;\n  if (request.task === 'vision' && provider.name === 'nvidia') return NVIDIA_VISION_TIMEOUT_MS;\n  if (request.task === 'vision' && provider.name === 'openrouter') return OPENROUTER_VISION_TIMEOUT_MS;")
          replace('services/api-gateway/src/ai/providerRouter.ts', "? (env.NVIDIA_VISION_MODEL || 'nvidia/nemotron-nano-12b-v2-vl')", "? (env.NVIDIA_VISION_MODEL || 'nvidia/nemotron-3-nano-omni-30b-a3b-reasoning')")
          replace('services/api-gateway/src/routes/ai.ts', "visionOrder: c.env.AI_VISION_PROVIDER_ORDER || 'gemini,nvidia,openrouter',", "visionOrder: c.env.AI_VISION_PROVIDER_ORDER || 'groq,nvidia,gemini,openrouter',")

          wrangler = Path('services/api-gateway/wrangler.toml')
          text = wrangler.read_text(encoding='utf-8')
          old_order = 'AI_VISION_PROVIDER_ORDER = "gemini,nvidia,openrouter"'
          if text.count(old_order) != 3:
              raise SystemExit(f'wrangler order count={text.count(old_order)}')
          text = text.replace(old_order, 'AI_VISION_PROVIDER_ORDER = "groq,nvidia,gemini,openrouter"')
          old_model = 'NVIDIA_VISION_MODEL = "nvidia/nemotron-nano-12b-v2-vl"'
          if text.count(old_model) != 3:
              raise SystemExit(f'wrangler NVIDIA model count={text.count(old_model)}')
          text = text.replace(old_model, 'NVIDIA_VISION_MODEL = "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"')
          text = text.replace('# OTONOM 3.14.48 production deploy · single-image newspaper Vision · release', '# OTONOM 3.14.49 production deploy · current Groq + NVIDIA Vision · release')
          wrangler.write_text(text, encoding='utf-8')

          replace('apps/web/src/lib/newspaperVisionViews.ts', 'const COMPOSITE_WIDTH = 2600;\nconst COMPOSITE_HEIGHT = 2200;\nconst COMPOSITE_PADDING = 24;\nconst COMPOSITE_GAP = 24;\nconst COMPOSITE_JPEG_QUALITY = 0.9;', 'const COMPOSITE_WIDTH = 2200;\nconst COMPOSITE_HEIGHT = 1900;\nconst COMPOSITE_PADDING = 20;\nconst COMPOSITE_GAP = 20;\nconst COMPOSITE_JPEG_QUALITY = 0.84;')
          replace('apps/web/src/lib/newspaperVisionViews.test.ts', '    expect(layout.width).toBe(2600);\n    expect(layout.height).toBe(2200);', '    expect(layout.width).toBe(2200);\n    expect(layout.height).toBe(1900);')

          replace_in_test('services/api-gateway/src/ai/providerRouter.test.ts', "it('varsayılan production Vision zincirinde NVIDIA ve Groqyu çağırmaz'", [
              ("it('varsayılan production Vision zincirinde NVIDIA ve Groqyu çağırmaz'", "it('varsayılan production Vision zincirinde güncel Groq Vision sağlayıcısını önce çağırır'", 1),
              ("      candidates: [{ content: { parts: [{ text: '{\"isContentUnreadable\":false,\"gazeteBasliklari\":[]}' }] } }],", "      choices: [{ message: { content: '{\"isContentUnreadable\":false,\"gazeteBasliklari\":[]}' } }],", 1),
              ("expect(result.provider).toBe('gemini');", "expect(result.provider).toBe('groq');", 1),
              ("generativelanguage.googleapis.com", "api.groq.com", 1),
          ])

          replace_in_test('services/api-gateway/src/ai/newspaperSingleImageFallback.test.ts', "it('Gemini iki kez doğrulamayı geçmezse doğrudan NVIDIA Vision sağlayıcısına geçer'", [
              ("it('Gemini iki kez doğrulamayı geçmezse doğrudan NVIDIA Vision sağlayıcısına geçer'", "it('Gemini iki kez doğrulamayı geçmezse doğrudan Groq Vision sağlayıcısına geçer'", 1),
              ("      GEMINI_API_KEY: 'gemini-test',\n      NVIDIA_API_KEY: 'nvidia-test',", "      GEMINI_API_KEY: 'gemini-test',\n      GROQ_API_KEY: 'groq-test',\n      NVIDIA_API_KEY: 'nvidia-test',", 1),
              ("      ALLOW_NVIDIA_TRIAL: 'true',", "      ALLOW_NVIDIA_TRIAL: 'true',\n      AI_VISION_PROVIDER_ORDER: 'gemini,groq,nvidia,openrouter',", 1),
              ("expect(result.provider).toBe('nvidia');", "expect(result.provider).toBe('groq');", 1),
              ("integrate.api.nvidia.com", "api.groq.com", 1),
          ])

          replace('services/api-gateway/src/ai/nvidiaVisionConfig.test.ts', 'uses Nemotron Nano 12B VL and does not send text-only reasoning_budget', 'uses current Nemotron 3 Nano Omni vision model and does not send text-only reasoning_budget')
          replace('services/api-gateway/src/ai/nvidiaVisionConfig.test.ts', 'nvidia/nemotron-nano-12b-v2-vl', 'nvidia/nemotron-3-nano-omni-30b-a3b-reasoning', count=2)
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Set OTONOM 3.14.49 version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$CURRENT" = "3.14.48" ]; then
            npm run version:bump
          elif [ "$CURRENT" != "3.14.49" ]; then
            echo "Unexpected version: $CURRENT"
            exit 1
          fi

      - name: Check version consistency
        run: npm run version:check

      - name: Run full Vitest suite
        run: npm test

      - name: Typecheck web app
        run: npm run typecheck --workspace=apps/web

      - name: Build web app
        run: npm run build:web
        env:
          VITE_API_URL: https://api.seref-keser.workers.dev

      - name: Typecheck AI gateway
        run: npm run typecheck --workspace=services/api-gateway

      - name: Test AI gateway
        run: npm run test --workspace=services/api-gateway

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright browser e2e
        run: npm run test:e2e
        env:
          VITE_API_URL: https://api.seref-keser.workers.dev

      - name: Commit verified patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: replace retired newspaper Vision provider'
          git push origin HEAD:main

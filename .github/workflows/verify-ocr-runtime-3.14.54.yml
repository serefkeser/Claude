name: Verify OTONOM 3.14.54 OCR Runtime

on:
  push:
    branches:
      - fix/final-stability-3.14.54
    paths:
      - .github/ocr-runtime-3.14.54.trigger

jobs:
  verify-ocr-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/final-stability-3.14.54

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check exact OTONOM version
        run: npm run version:check

      - name: Initialize Turkish Tesseract runtime
        run: |
          node --input-type=module <<'NODE'
          import { createWorker } from 'tesseract.js';
          const worker = await createWorker('tur');
          try {
            console.log('Tesseract Turkish runtime initialized successfully.');
          } finally {
            await worker.terminate();
          }
          NODE

name: Verify OTONOM 3.14.56 Dual Evidence

on:
  push:
    branches:
      - fix/newspaper-ocr-anchor-3.14.56
    paths:
      - .github/newspaper-consensus-3.14.56.trigger

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/newspaper-ocr-anchor-3.14.56
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply dual-evidence consensus patch
        run: python .github/scripts/patch-newspaper-consensus-3.14.56.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check exact version
        run: |
          test "$(node -p "require('./package.json').version")" = "3.14.56"
          npm run version:check

      - name: Run full Vitest suite
        run: npm test

      - name: Typecheck web app
        run: npm run typecheck --workspace=apps/web

      - name: Build web app
        run: npm run build:web
        env:
          VITE_API_URL: https://api.seref-keser.workers.dev

      - name: Typecheck AI gateway
        run: npm run typecheck --workspace=services/api-gateway

      - name: Test AI gateway
        run: npm run test --workspace=services/api-gateway

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright browser e2e
        run: npm run test:e2e
        env:
          VITE_API_URL: https://api.seref-keser.workers.dev

      - name: Commit verified source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/lib/newspaperEvidenceVerification.ts apps/web/src/lib/newspaperEvidenceVerification.test.ts
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'fix: use dual evidence for newspaper publication text'
            git push origin HEAD:fix/newspaper-ocr-anchor-3.14.56
          fi

name: One-time sync Hermes into Claude

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-hermes-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Claude
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact Hermes snapshot
        run: |
          git clone --no-checkout https://github.com/serefkeser/hermes.git /tmp/hermes
          git -C /tmp/hermes checkout 614ac23b49c7db1099d2a44c7accc5f4c03f5fd7

      - name: Replace Claude content with Hermes except workflows
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            /tmp/hermes/ ./

      - name: Commit and push synchronized tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Already synchronized.'
            exit 0
          fi
          git commit -m 'sync: copy Hermes 614ac23 into Claude (code/content)'
          git push origin HEAD:main
